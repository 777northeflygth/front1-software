# ============================================================
#  AZURE PIPELINE - GASFIPRO FRONTEND (React + Vite)
# ============================================================
#  Propósito: Construir la aplicación React y publicar
#  los artefactos para su posterior despliegue.
# ============================================================

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '20.x'
  buildFolder: 'dist'

steps:

# 0. Checkout con historial completo (necesario para SonarCloud)
- checkout: self
  fetchDepth: 0

# 1. Configurar Node.js
- task: NodeTool@0
  inputs:
    versionSpec: '$(nodeVersion)'
  displayName: 'Instalar Node.js $(nodeVersion)'

# 2. Instalar dependencias
- script: |
    npm ci
    npm install -D sass-embedded
  displayName: 'Instalar dependencias (incluyendo sass-embedded)'

# 3. Preparar análisis de SonarCloud (se ejecuta antes del build)
- task: SonarCloudPrepare@4
  inputs:
    SonarCloud: 'SonarCloud' # Nombre de tu Service Connection en Azure DevOps
    organization: 'TU_ORGANIZACION_SONAR' # ej: benjamin-flandez
    scannerMode: 'cli'
    configMode: 'manual'
    cliProjectKey: 'TU_ORG_TU_REPO_FRONTEND' # ej: benjamin-flandez_gasfipro-frontend
    cliProjectName: 'Gasfipro Frontend'
    extraProperties: |
      sonar.sources=src
      sonar.tests=src
      sonar.test.inclusions=**/*.test.js
      sonar.javascript.lcov.reportPaths=coverage/lcov.info
      sonar.qualitygate.wait=true # Opcional: hace fallar el pipeline si el Quality Gate no pasa

# 4. Ejecutar pruebas con cobertura (genera coverage/lcov.info)
- script: |
    npm run test:coverage -- --coverage.reporter=lcov
  displayName: 'Ejecutar pruebas con cobertura LCOV'

# 5. Construir la aplicación
- script: |
    npm run build
  displayName: 'Construir aplicación'

# 6. Ejecutar el análisis de SonarCloud
- task: SonarCloudAnalyze@4
  displayName: 'Análisis de SonarCloud'

# 7. Publicar el resultado del Quality Gate (para que Azure DevOps lo reciba)
- task: SonarCloudPublish@4
  inputs:
    pollingTimeoutSec: '300'
  displayName: 'Publicar Quality Gate'

# 8. Publicar artefactos
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(buildFolder)'
    ArtifactName: 'frontend-build'
  displayName: 'Publicar artefactos (carpeta dist)'

# ============================================================
#  NOTAS PARA EL DESPLIEGUE
# ============================================================
# 1. Para desplegar en Azure Static Web Apps, necesitas un token.
#    Configura la variable AZURE_STATIC_WEB_APPS_API_TOKEN en la
#    UI de Azure DevOps (Library > Variable Groups).
#    Luego descomenta la tarea AzureStaticWebApp@0.
#
# 2. Para desplegar en Azure App Service (Linux con Node),
#    necesitas una conexión de servicio de Azure configurada.
#    Descomenta las tareas ArchiveFiles@2 y AzureWebApp@1.
#
# 3. Si usas variables de entorno en React (VITE_*), asegúrate de
#    definirlas en el pipeline o en el archivo .env.production.
# ============================================================

